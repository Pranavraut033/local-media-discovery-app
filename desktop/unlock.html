<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unlock Local Media Discovery</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --surface: #fffaf2;
        --ink: #1f2a37;
        --muted: #5b6470;
        --accent: #126a78;
        --accent-strong: #0b4d58;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: radial-gradient(
          circle at top,
          #fdf4e8 0%,
          var(--bg) 45%,
          #e9edf2 100%
        );
        display: grid;
        place-items: center;
        color: var(--ink);
      }

      .card {
        width: min(360px, calc(100vw - 32px));
        background: color-mix(in srgb, var(--surface) 92%, white);
        border: 1px solid rgba(18, 106, 120, 0.15);
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(15, 41, 59, 0.2);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid rgba(18, 106, 120, 0.25);
        background: white;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 1.15rem;
        letter-spacing: 0.28rem;
        text-align: center;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(18, 106, 120, 0.15);
      }

      button {
        margin-top: 14px;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 12px 16px;
        background: linear-gradient(
          120deg,
          var(--accent),
          var(--accent-strong)
        );
        color: #fff;
        font-size: 0.98rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      #error {
        margin-top: 12px;
        min-height: 20px;
        color: var(--danger);
        font-size: 0.88rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Unlock App</h1>
      <p>Enter your launch PIN to open Local Media Discovery.</p>
      <form id="unlock-form">
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="••••••"
          autofocus
        />
        <button id="submit" type="submit">Unlock</button>
      </form>
      <div id="error" role="alert"></div>
    </main>

    <script>
      const form = document.getElementById("unlock-form");
      const pinInput = document.getElementById("pin");
      const submit = document.getElementById("submit");
      const errorBox = document.getElementById("error");

      pinInput.addEventListener("input", () => {
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 6);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const pin = pinInput.value;

        if (pin.length !== 6) {
          errorBox.textContent = "PIN must be exactly 6 digits.";
          return;
        }

        submit.disabled = true;
        errorBox.textContent = "";

        try {
          const result = await window.desktopBridge.submitUnlockPin(pin);
          if (!result || !result.success) {
            errorBox.textContent = result?.message || "Unlock failed.";
            submit.disabled = false;
            pinInput.value = "";
            pinInput.focus();
          }
        } catch (_error) {
          errorBox.textContent = "Unexpected unlock error.";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
