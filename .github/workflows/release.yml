name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron-builder-args: --mac dmg zip
          - os: windows-latest
            electron-builder-args: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm run install:all

      - name: Build TypeScript projects
        shell: bash
        run: npm run build

      - name: Prune backend to production deps
        shell: bash
        run: cd backend && npm prune --production

      - name: Rebuild native modules for Electron
        shell: bash
        run: npm run desktop:rebuild-native

      - name: Package Electron app
        shell: bash
        run: npx electron-builder ${{ matrix.electron-builder-args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: CHANGELOG.md
          files: artifacts/**
